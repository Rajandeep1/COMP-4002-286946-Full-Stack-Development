<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixell River Employee Directory</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        
          <img
            src="logo.jpg"
            alt="Pixell River Financial Logo"
            class="logo"
          />
  
        <div class="header-text">
          <h1 class="site-title">Pixell River Employee Directory</h1>
          <p class="greeting">
            Welcome — browse our teams and the people behind Pixell River Financial.
          </p>
        </div>
      </div>
    </header>

    <main id="main-content" class="main-content">
     </main>

    <footer class="site-footer">
      <p class="copyright">
        &copy; <span id="current-year"></span> Pixell River Financial. All rights reserved.
      </p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
